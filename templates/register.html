<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - IELTS Master</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<nav class="navbar">

    <div class="logo">
        IELTS Master
    </div>


    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/reading-test">Reading</a>

        <a href="#">Listening</a>

        <a href="#">Writing</a>

        <a href="#">Speaking</a>

    </div>

</nav>



<section class="auth-section">


    <div class="auth-card">


        <h1>
            Create Your Account
        </h1>


        <p>
            Start practicing IELTS with a realistic computer-based exam experience.
        </p>



        <form method="POST">

            <label>
    Name
</label>


<input
    type="text"
    name="name"
    placeholder="Enter your name"
    required
>

            <label>
                Email
            </label>


            <input 
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >



            <label>
                Password
            </label>


            <input 
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >



            <button type="submit">
                Create Account
            </button>


        </form>



        <p class="auth-footer">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>


    </div>


</section>


</body>

</html>
